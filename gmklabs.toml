# gmklabs — the single pinned revision in this repository.
#
# gomoku-gui is pinned here. rust-ml is deliberately NOT pinned here:
# gomoku-gui depends on rust-ml through a git revision in its own
# Cargo.toml, and the installer reads the revision from there at
# install time. The GUI's cargo pin stays the single source of truth
# for the rust-ml version, so the installed command-line tools can
# never silently disagree with the GUI about record formats.

